  #        condition: service_healthy
  #    deploy:
  #      replicas: 1



  ticket-reseller-microservice:
    build: ./TicketResellerProviderREST
    ports:
      - "9061:8080"
    environment:
      SERVER_PORT: 9061
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      EUREKA_SERVER: http://discovery-service:8761/eureka/
      EUREKA_HOSTNAME: ticket-reseller-microservice
      MYSQL_HOST: ticketing-mysql
      MYSQL_DB: reseller
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    depends_on:
      - ticketing-mysql
    deploy:
      replicas: 1

