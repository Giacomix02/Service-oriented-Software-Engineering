services:
  ticketing-mysql:
    image: mysql:latest
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./DB/infos.sql:/docker-entrypoint-initdb.d/1_infos.sql
      - ./DB/streaming.sql:/docker-entrypoint-initdb.d/2_streaming.sql
      - ./DB/tickets.sql:/docker-entrypoint-initdb.d/3_tickets.sql
      - ./DB/reseller.sql:/docker-entrypoint-initdb.d/4_reseller.sql
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ticketing-phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    links:
      - "ticketing-mysql:db"
    depends_on:
      - ticketing-mysql

  gateway:
    build: ./Gateway
    ports:
      - "9000:9000"
    environment:
      MUSIC_STATS_HOST: music-stats-microservice
      MUSIC_STATS_PORT: 9050
      ARTIST_ANALYZER_HOST: artist-analyzer-microservice
      ARTIST_ANALYZER_PORT: 9071
      SERVER_PORT: 9000
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      EUREKA_SERVER: http://discovery-service:8761/eureka/

  discovery-service:
    build: ./DiscoveryService
    ports:
      - "8761:8761"
    environment:
      EUREKA_HOST: discovery-service
      SERVER_PORT: 8761


  legacy-box-office-microservice:
    build: ./LegacyBoxOfficeProviderSOAP
    ports:
      - "9045:8080"
    environment:
      MYSQL_HOST: ticketing-mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ticketing
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    depends_on:
      ticketing-mysql:
        condition: service_healthy
    deploy:
      replicas: 1

  #  music-stats-microservice:
  #    build: ./MusicStatsProviderProsumerREST
  #    ports:
  #      - "9050:9050"
  #    environment:
  #      SERVER_PORT: 9050
  #      CONFIG_SERVER_HOST: config-server
  #      CONFIG_SERVER_PORT: 8888
  #      EUREKA_SERVER: http://discovery-service:8761/eureka/
