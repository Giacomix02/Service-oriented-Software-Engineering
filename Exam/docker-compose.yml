services:
  ticketing-mysql:
    image: mysql:latest
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./DB/infos.sql:/docker-entrypoint-initdb.d/1_infos.sql
      - ./DB/streaming.sql:/docker-entrypoint-initdb.d/2_streaming.sql
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ticketing-phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    links:
      - "ticketing-mysql:db"
    depends_on:
      - ticketing-mysql

