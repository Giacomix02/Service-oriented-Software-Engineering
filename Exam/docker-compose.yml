  music-stats-microservice:
    build: ./MusicStatsProviderProsumerREST
    ports:
      - "9050-9055:9050"
    environment:
      SERVER_PORT: 9050
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      EUREKA_SERVER: http://discovery-server:8761/eureka/
      MYSQL_HOST: ticketing-mysql:3306
      MYSQL_DB: MusicStats
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    depends_on:
      ticketing-mysql:
        condition: service_healthy
    deploy:
      replicas: 1


  streaming-availability-microservice:
    build: ./StreamingAvailabilityProsumerREST
    ports:
      - "9056-9060:9056"
    environment:
      SERVER_PORT: 9056
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      EUREKA_SERVER: http://discovery-server:8761/eureka/
      MYSQL_HOST: ticketing-mysql:3306
      MYSQL_DB: StreamingAvailability
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    depends_on:
      ticketing-mysql:
        condition: service_healthy
    deploy:
      replicas: 1

